<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad Patrimonial - Operativa</title>
    <!-- CSS de Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF para exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body{font-family: 'Inter', sans-serif;}
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- CONTENEDOR DE LA APLICACIÓN -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- VISTAS SE INYECTAN DINÁMICAMENTE -->
    </div>

    <!-- SCRIPT DE LÓGICA Y FUNCIONALIDAD COMPLETA -->
    <script>
        // --- BASE DE DATOS LOCAL INICIAL ---
        const PLANTAS_PREDETERMINADAS = [
            { identificación: 'bagley_totoral', nombre: 'Total Bagley', administración: 'Moyano Santiago Iván' },
            { identificación: 'cartocor_totoral', nombre: 'Cartocor Total', administración: 'Moyano Santiago Iván' },
            { identificación: 'arcor_caroya', nombre: 'Arcor Caroya', administración: 'Yamila Soledad Jaime' },
            { identificación: 'bagley_córdoba', nombre: 'Bagley Córdoba', administration: 'Sabrina Emilce Santillan' },
            { identificación: 'edificio_chabacucho', nombre: 'Edificio Chacabuco', administración: 'Héctor Fabián Maldonado' }
        ];

        const USUARIOS_PREDETERMINADOS = [
            // Administradores
            { nombre_de_usuario: 'moyano', aprobar: 'Admin123*', nombre: 'Moyano Santiago Iván', role: 'jefe_equipo', planta: 'bagley_totoral', debeCambiarPase:verdadero },
            { nombre_de_usuario: 'administrador_cartocor', aprobar: 'Admin123*', nombre: 'Arcor Caroya', role: 'cartocor_totoral', debeCambiarPase:verdadero },
            { nombre_de_usuario: 'yamila', aprobar: 'Admin123*', nombre: 'Yamila Soledad Jaime', role: 'jefe_equipo', planta: 'bagley_Córdoba', debeCambiarPase:verdadero },
            { nombre_de_usuario: 'sabrina', aprobar: 'Admin123*', nombre: 'Sabrina Emilce Santillan', role: 'jefe_equipo', planta: 'Bagley Córdoba', debeCambiarPase:verdadero },
            { nombre_de_usuario: 'hector', aprobar: 'Admin123*', nombre: 'Héctor Fabián Maldonado', role: 'jefe_equipo', planta: 'edificio_chabacucho', debeCambiarPase:verdadero },
            // Operadores / Vigiladores
            { nombre_de_usuario: 'vigilador1', aprobar: 'Vigia123*', nombre: 'Vigilador de Turno', role: 'vigilador', planta: 'bagley_totoral', debeCambiarPase:verdadero }
        ];

        // Inicialización de LocalStorage si no existe
        if (!localStorage.getItem('sp_plantas')) {
            localStorage.setItem('sp_plantas', JSON.stringify(PLANTAS_PREDETERMINADAS));
        }
        if (!localStorage.getItem('sp_usuarios')) {
            localStorage.setItem('sp_usuarios', JSON.stringify(USUARIOS_PREDETERMINADOS));
        }
        if (!localStorage.getItem('sp_sesion')) {
            // Estado por defecto de la interfaz de inicio de sesión
            renderLogin();
        } else {
            renderApp();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/10 text-blue-500 mb-4">
                                <i class="fa-solid fa-shield-halved text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-white">Seguridad Patrimonial</h1>
                            <p class="text-slate-400 text-sm mt-1">Sistema Operativo de Control y Vigilancia</p>
                        </div>
                        <form onsubmit="ejecutarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Usuario</label>
                                <input type="text" id="login_user" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
                                <input type="password" id="login_pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-blue-600/20 mt-2">
                                Iniciar Sesión
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function ejecutarLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value.trim();
            const usuarios = JSON.parse(localStorage.getItem('sp_usuarios')) || [];
            
            const encontrado = usuarios.find(x => x.nombre_de_usuario === u && x.aprobar === p);
            if (encontrado) {
                localStorage.setItem('sp_sesion', JSON.stringify(encontrado));
                renderApp();
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('sp_sesion');
            renderLogin();
        }

        function renderApp() {
            const sesion = JSON.parse(localStorage.getItem('sp_sesion'));
            if (!sesion) { renderLogin(); return; }

            document.getElementById('app').innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-blue-600/10 text-blue-500 flex items-center justify-center">
                                <i class="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <div>
                                <span class="font-bold text-white block leading-tight">Seguridad Patrimonial</span>
                                <span class="text-xs text-slate-400">Planta: <strong class="text-blue-400">${sesion.planta}</strong></span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="text-sm text-slate-300 hidden md:inline">Operador: <strong class="text-white">${sesion.nombre}</strong></span>
                            <button onclick="cerrarSesion()" class="bg-slate-800 hover:bg-red-600/20 hover:text-red-400 text-slate-300 px-3 py-2 rounded-lg text-sm transition-colors border border-slate-700">
                                <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
                            </button>
                        </div>
                    </div>
                </header>
                <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 text-center">
                        <h2 class="text-xl font-bold text-white mb-2">¡Sistema Operativo Inicializado Correctamente!</h2>
                        <p class="text-slate-400">El entorno se encuentra listo para registrar rondas, accesos, novedades y operaciones.</p>
                    </div>
                </main>
            `;
        }
    </script>
</body>
</html>
