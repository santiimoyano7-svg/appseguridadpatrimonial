<!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
<div id="app" class="flex-1 flex flex-col"></div>

<!-- MODAL GENERAL -->
<div id="global_modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
        <div class="flex items-center gap-3">
            <div id="modal_icon" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl"></div>
            <div>
                <h3 id="modal_title" class="text-lg font-bold text-white"></h3>
                <p id="modal_subtitle" class="text-xs text-slate-400"></p>
            </div>
        </div>
        <div id="modal_body" class="text-sm text-slate-300"></div>
        <div id="modal_footer" class="flex justify-end gap-3 pt-2"></div>
    </div>
</div>

<!-- SCRIPT DE LÓGICA INTEGRADA -->
<script>
    const PLANTS = [
        { id: 'bagley_totoral', name: 'Bagley Totoral', admin: 'Moyano Santiago Iván' },
        { id: 'cartocor_totoral', name: 'Cartocor Totoral', admin: 'Moyano Santiago Iván' },
        { id: 'arcor_caroya', name: 'Arcor Caroya', admin: 'Yamila Soledad Jaime' },
        { id: 'bagley_cordoba', name: 'Bagley Córdoba', admin: 'Sabrina Emilce Santillan' },
        { id: 'edificio_chacabuco', name: 'Edificio Chacabuco', admin: 'Héctor Fabián Maldonado' }
    ];

    const INITIAL_USERS = [
        { username: 'moyano', pass: 'Admin123*', name: 'Moyano Santiago Iván', role: 'jefe_equipo', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
        { username: 'cartocor_admin', pass: 'Admin123*', name: 'Moyano Santiago Iván', role: 'administrador_planta', plant: 'cartocor_totoral', mustChangePass: true },
        { username: 'yamila', pass: 'Admin123*', name: 'Yamila Soledad Jaime', role: 'administrador_planta', plant: 'arcor_caroya', mustChangePass: true },
        { username: 'sabrina', pass: 'Admin123*', name: 'Sabrina Emilce Santillan', role: 'administrador_planta', plant: 'bagley_cordoba', mustChangePass: true },
        { username: 'hector', pass: 'Admin123*', name: 'Héctor Fabián Maldonado', role: 'administrador_planta', plant: 'edificio_chacabuco', mustChangePass: true },
        { username: 'ontiveros', pass: 'Seguridad123*', name: 'Ontiveros Gustavo Ariel', role: 'jefe_seguridad', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
        { username: 'varela', pass: 'Seguridad123*', name: 'Varela Sebastián Alfredo', role: 'jefe_seguridad', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
        { username: 'vigilador1', pass: '1234', name: 'Juan Pérez', role: 'vigilador', plant: 'bagley_totoral', mustChangePass: false },
        { username: 'encargado1', pass: '1234', name: 'Carlos Gómez', role: 'encargado_turno', plant: 'bagley_totoral', mustChangePass: false }
    ];

    function initAppStorage() {
        if (!localStorage.getItem('sp_plants')) localStorage.setItem('sp_plants', JSON.stringify(PLANTS));
        if (!localStorage.getItem('sp_users')) localStorage.setItem('sp_users', JSON.stringify(INITIAL_USERS));
        if (!localStorage.getItem('sp_current_user')) localStorage.setItem('sp_current_user', null);
        if (!localStorage.getItem('sp_selected_plant')) localStorage.setItem('sp_selected_plant', null);
        if (!localStorage.getItem('sp_current_module')) localStorage.setItem('sp_current_module', 'rondas');
        if (!localStorage.getItem('sp_dynamic_sheets')) localStorage.setItem('sp_dynamic_sheets', JSON.stringify([]));

        const tables = ['rondas', 'novedades', 'vehiculos', 'transporte', 'cctv', 'correspondencia', 'cofres', 'autos_planta', 'llaves', 'cortacandados', 'notebooks', 'precintos', 'horarios', 'procedimientos'];
        tables.forEach(t => {
            if (!localStorage.getItem('sp_' + t)) localStorage.setItem('sp_' + t, JSON.stringify([]));
        });
    }
    initAppStorage();

    let currentUser = JSON.parse(localStorage.getItem('sp_current_user'));
    let selectedPlant = localStorage.getItem('sp_selected_plant');
    let currentModule = localStorage.getItem('sp_current_module') || 'rondas';

    function render() {
        currentUser = JSON.parse(localStorage.getItem('sp_current_user'));
        selectedPlant = localStorage.getItem('sp_selected_plant');
        const app = document.getElementById('app');

        if (!currentUser) {
            app.innerHTML = renderLoginView();
        } else if (currentUser.mustChangePass) {
            app.innerHTML = renderChangePasswordView();
        } else if (!selectedPlant && !currentUser.globalAccess) {
            app.innerHTML = renderPlantSelectorView();
        } else if (!selectedPlant && currentUser.globalAccess) {
            selectedPlant = 'bagley_totoral';
            localStorage.setItem('sp_selected_plant', selectedPlant);
            app.innerHTML = renderDashboardView();
            initModuleLogic();
        } else {
            app.innerHTML = renderDashboardView();
            initModuleLogic();
        }
    }

    function renderLoginView() {
        return `
            <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
                    <div class="text-center space-y-2">
                        <div class="inline-flex p-4 bg-indigo-600/20 text-indigo-400 rounded-2xl text-4xl mb-1 shadow-inner">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">Seguridad Patrimonial</h1>
                        <p class="text-xs text-slate-400">Sistema Operativo Multi-Planta | Arcor & Bagley</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Usuario / Legajo</label>
                            <input type="text" id="login_user" required placeholder="Ej: moyano, yamila, vigilador1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contraseña</label>
                            <input type="password" id="login_pass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">
                            Iniciar Sesión Operativa
                        </button>
                    </form>
                    <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 text-[11px] text-slate-400 space-y-1.5">
                        <p class="font-semibold text-slate-300 mb-1"><i class="fa-solid fa-circle-info mr-1 text-indigo-400"></i> Accesos Principales:</p>
                        <p>• Superadmin (5 Plantas): <span class="text-indigo-400 font-mono">moyano</span> / <span class="text-indigo-400 font-mono">Admin123*</span></p>
                        <p>• Adm. Caroya: <span class="text-indigo-400 font-mono">yamila</span> / <span class="text-indigo-400 font-mono">Admin123*</span></p>
                        <p>• Observadores Seguridad: <span class="text-indigo-400 font-mono">ontiveros</span> / <span class="text-indigo-400 font-mono">Seguridad123*</span></p>
                    </div>
                </div>
            </div>
        `;
    }

    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('login_user').value.trim();
        const p = document.getElementById('login_pass').value;
        const users = JSON.parse(localStorage.getItem('sp_users')) || [];
        const found = users.find(x => x.username === u && x.pass === p);

        if (found) {
            localStorage.setItem('sp_current_user', JSON.stringify(found));
            render();
        } else {
            showModal('Error de Acceso', 'Usuario o contraseña incorrectos.', 'fa-solid fa-triangle-exclamation text-rose-500', 'bg-rose-500/10');
        }
    }

    function renderChangePasswordView() {
        return `
            <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
                    <div class="text-center space-y-2">
                        <div class="inline-flex p-4 bg-amber-500/20 text-amber-400 rounded-2xl text-4xl mb-1">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h2 class="text-xl font-bold text-white">Actualización de Contraseña</h2>
                        <p class="text-xs text-slate-400">Por seguridad, debe establecer una nueva clave personal.</p>
                    </div>
                    <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nueva Contraseña</label>
                            <input type="password" id="new_pass" required minlength="4" placeholder="Mínimo 4 caracteres" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-amber-600/30 text-sm">
                            Guardar y Acceder al Sistema
                        </button>
                    </form>
                </div>
            </div>
        `;
    }

    function handlePasswordChange(e) {
        e.preventDefault();
        const np = document.getElementById('new_pass').value;
        if (np.length < 4) {
            showModal('Atención', 'La contraseña debe tener al menos 4 caracteres.', 'fa-solid fa-triangle-exclamation text-amber-400', 'bg-amber-500/10');
            return;
        }
        currentUser.pass = np;
        currentUser.mustChangePass = false;

        let users = JSON.parse(localStorage.getItem('sp_users')) || [];
        users = users.map(u => u.username === currentUser.username ? currentUser : u);
        localStorage.setItem('sp_users', JSON.stringify(users));
        localStorage.setItem('sp_current_user', JSON.stringify(currentUser));
        render();
    }

    function renderPlantSelectorView() {
        const plants = JSON.parse(localStorage.getItem('sp_plants')) || PLANTS;
        return `
            <div class="flex-1 flex items-center justify-center p-6 bg-slate-950">
                <div class="max-w-2xl w-full space-y-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-bold text-white">Seleccione Planta Operativa</h1>
                        <p class="text-slate-400 text-sm">Elija la instalación asignada para realizar su turno de servicio.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${plants.map(p => `
                            <button onclick="selectPlant('${p.id}')" class="bg-slate-900 hover:bg-indigo-950/40 border border-slate-800 hover:border-indigo-500 p-5 rounded-2xl text-left transition flex items-center justify-between group shadow-lg">
                                <div class="space-y-1">
                                    <h3 class="font-bold text-white group-hover:text-indigo-400 text-base">${p.name}</h3>
                                    <p class="text-xs text-slate-400">Adm: ${p.admin}</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-indigo-400 transition text-sm"></i>
                            </button>
                        `).join('')}
                    </div>
                    <div class="text-center pt-4">
                        <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        `;
    }

    function selectPlant(id) {
        localStorage.setItem('sp_selected_plant', id);
        render();
    }

    function logout() {
        localStorage.removeItem('sp_current_user');
        localStorage.removeItem('sp_selected_plant');
        render();
    }

    function renderDashboardView() {
        const plants = JSON.parse(localStorage.getItem('sp_plants')) || PLANTS;
        const plantObj = plants.find(p => p.id === selectedPlant) || plants[0];
        const isObserver = currentUser.role === 'jefe_seguridad';
        const isAdmin = ['jefe_equipo', 'administrador_planta'].includes(currentUser.role);
        const dynamicSheets = JSON.parse(localStorage.getItem('sp_dynamic_sheets')) || [];

        return `
            <div class="flex h-screen overflow-hidden">
                <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
                    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                        <div class="space-y-0.5 truncate">
                            <h2 class="font-bold text-white text-sm truncate">${plantObj.name}</h2>
                            <p class="text-[11px] text-indigo-400 font-medium capitalize">${currentUser.role.replace('_', ' ')} ${isObserver ? '(Observador)' : ''}</p>
                        </div>
                        <button onclick="changePlantModal()" title="Cambiar Planta" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl transition text-xs">
                            <i class="fa-solid fa-building-shield"></i>
                        </button>
                    </div>
                    <nav class="flex-1 overflow-y-auto p-3 space-y-1.5 text-xs">
                        <div class="text-slate-400 font-semibold px-3 py-1 uppercase tracking-wider text-[10px]">Operativa Principal</div>
                        <a onclick="setModule('rondas')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='rondas'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-route w-4 text-center"></i> Rondas & Checklist QR</a>
                        <a onclick="setModule('novedades')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='novedades'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-triangle-exclamation w-4 text-center"></i> Planilla de Novedades</a>
                        <a onclick="setModule('vehiculos')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='vehiculos'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-truck-ramp-box w-4 text-center"></i> Control Acceso Vehicular</a>
                        <a onclick="setModule('transporte')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='transporte'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-truck-fast w-4 text-center"></i> Novedades en Transportes</a>
                        
                        <div class="text-slate-400 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Controles y Registros</div>
                        <a onclick="setModule('cctv')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='cctv'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-video w-4 text-center"></i> Control de CCTV</a>
                        <a onclick="setModule('llaves')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='llaves'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-key w-4 text-center"></i> Gestión y Llaves</a>
                        <a onclick="setModule('cofres')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='cofres'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-box-archive w-4 text-center"></i> Relevamiento Cofres</a>
                        <a onclick="setModule('correspondencia')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='correspondencia'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-envelope w-4 text-center"></i> Correspondencia</a>
                        <a onclick="setModule('autos_planta')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='autos_planta'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-car w-4 text-center"></i> Autos Corporativos</a>
                        <a onclick="setModule('cortacandados')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='cortacandados'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-scissors w-4 text-center"></i> Entrega Corta Candados</a>
                        <a onclick="setModule('notebooks')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='notebooks'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-laptop w-4 text-center"></i> Registro Notebooks</a>
                        <a onclick="setModule('precintos')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='precintos'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-lock w-4 text-center"></i> Control de Precintos</a>

                        ${dynamicSheets.length > 0 ? `
                            <div class="text-slate-400 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Planillas Importadas (Excel)</div>
                            ${dynamicSheets.map(ds => `
                                <a onclick="setModule('dynamic_${ds.id}')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='dynamic_'+ds.id?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-file-excel w-4 text-center text-emerald-400"></i> ${ds.title}</a>
                            `).join('')}
                        ` : ''}

                        <div class="text-slate-400 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Institucional</div>
                        <a onclick="setModule('horarios')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='horarios'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-calendar-days w-4 text-center"></i> Horarios Mensuales</a>
                        <a onclick="setModule('procedimientos')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800/80 cursor-pointer transition ${currentModule==='procedimientos'?'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20':''}"><i class="fa-solid fa-book w-4 text-center"></i> Procedimientos (PDF)</a>

                        ${isAdmin ? `
                            <div class="text-slate-400 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Administración General</div>
                            <a onclick="setModule('gestion')" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-amber-400 hover:bg-amber-500/10 cursor-pointer transition ${currentModule==='gestion'?'bg-amber-600 text-white font-semibold shadow-lg shadow-amber-600/20':''}"><i class="fa-solid fa-gears w-4 text-center"></i> Gestión, Roles & Excel</a>
                        ` : ''}
                    </nav>
                    <div class="p-4 border-t border-slate-800 flex items-center justify-between bg-slate-950/40">
                        <div class="truncate pr-2">
                            <p class="text-xs font-semibold text-white truncate">${currentUser.name}</p>
                            <p class="text-[10px] text-slate-400 truncate">${currentUser.username}</p>
                        </div>
                        <button onclick="logout()" title="Cerrar Sesión" class="text-rose-400 hover:text-rose-300 p-2 transition"><i class="fa-solid fa-power-off text-sm"></i></button>
                    </div>
                </aside>
                <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
                    <header class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex items-center justify-between z-10">
                        <h1 id="module_title" class="text-lg font-bold text-white capitalize">Módulo Operativo</h1>
                        <div class="flex items-center gap-3">
                            ${isObserver ? `<span class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-eye"></i> Modo Observador (Solo Lectura)</span>` : ''}
                            <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-full text-xs font-semibold">${plantObj.name}</span>
                        </div>
                    </header>
                    <div id="module_container" class="flex-1 overflow-y-auto p-8"></div>
                </main>
            </div>
        `;
    }

    function setModule(mod) {
        currentModule = mod;
        localStorage.setItem('sp_current_module', mod);
        render();
    }

    function changePlantModal() {
        localStorage.removeItem('sp_selected_plant');
        render();
    }

    function showModal(title, subtitle, iconClass, iconBg, bodyHTML = '', footerHTML = '') {
        document.getElementById('modal_title').innerText = title;
        document.getElementById('modal_subtitle').innerText = subtitle;
        const icon = document.getElementById('modal_icon');
        icon.className = `w-12 h-12 rounded-xl flex items-center justify-center text-xl ${iconBg}`;
        icon.innerHTML = `<i class="${iconClass}"></i>`;
        document.getElementById('modal_body').innerHTML = bodyHTML;
        document.getElementById('modal_footer').innerHTML = footerHTML || `<button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">Aceptar</button>`;
        document.getElementById('global_modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('global_modal').classList.add('hidden');
    }

    function initModuleLogic() {
        const container = document.getElementById('module_container');
        const title = document.getElementById('module_title');

        if (currentModule.startsWith('dynamic_')) {
            const sheetId = currentModule.replace('dynamic_', '');
            const dynamicSheets = JSON.parse(localStorage.getItem('sp_dynamic_sheets')) || [];
            const sheet = dynamicSheets.find(s => s.id == sheetId);
            if (sheet) {
                title.innerText = sheet.title;
                container.innerHTML = renderDynamicSheetModule(sheet);
                return;
            }
        }

        switch(currentModule) {
            case 'rondas': title.innerText = "Rondas & Checklist QR"; container.innerHTML = renderRondasModule(); break;
            case 'novedades': title.innerText = "Planilla de Novedades"; container.innerHTML = renderNovedadesModule(); break;
            case 'vehiculos': title.innerText = "Control Acceso Vehicular"; container.innerHTML = renderVehiculosModule(); break;
            case 'transporte': title.innerText = "Novedades en Transportes"; container.innerHTML = renderTransportesModule(); break;
            case 'cctv': title.innerText = "Control de CCTV"; container.innerHTML = renderCCTVModule(); break;
            case 'llaves': title.innerText = "Gestión y Llaves"; container.innerHTML = renderLlavesModule(); break;
            case 'cofres': title.innerText = "Relevamiento Cofres"; container.innerHTML = renderCofresModule(); break;
            case 'gestion': title.innerText = "Gestión, Roles & Excel"; container.innerHTML = renderGestionModule(); break;
            default: title.innerText = currentModule; container.innerHTML = renderSimplePlaceholder(currentModule); break;
        }
    }

    function renderRondasModule() {
        const rondas = (JSON.parse(localStorage.getItem('sp_rondas')) || []).filter(r => currentUser.globalAccess || r.plant === selectedPlant);
        const isObserver = currentUser.role === 'jefe_seguridad';
        return `
            <div class="space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 p-5 rounded-2xl border border-slate-800 gap-4">
                    <div>
                        <h3 class="font-bold text-white text-base">Control Preventivo de Rondas con Escaneo QR</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Validación obligatoria por punto QR y checklists de riesgo aleatorios.</p>
                    </div>
                    <button onclick="exportPDFWithDates('rondas')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-lg"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    ${!isObserver ? `
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 shadow-xl">
                            <h4 class="font-bold text-white text-sm"><i class="fa-solid fa-qrcode text-indigo-400 mr-2"></i> Registrar Escaneo QR</h4>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Punto QR</label>
                                <select id="qr_punto" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                                    <option value="P1_PERIMETRO">Punto 1 - Perímetro Norte</option>
                                    <option value="P2_DEPOSITO">Punto 2 - Depósito Materia Prima</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Checklist</label>
                                <select id="qr_chk" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                                    <option value="Control de Riesgo Crítico">Control de Riesgo Crítico</option>
                                    <option value="Control de Precintos">Control de Precintos</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Estado</label>
                                <select id="qr_estado_chk" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                                    <option value="Conforme">Conforme</option>
                                    <option value="Anómalo (Generar Novedad)">Anómalo</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Detalle</label>
                                <textarea id="qr_novedad" placeholder="Detalle..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white h-20 resize-none"></textarea>
                            </div>
                            <button onclick="registrarEscaneoQR()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs transition">Registrar Ronda QR</button>
                        </div>
                    ` : ''}
                    <div class="${isObserver ? 'lg:col-span-3' : 'lg:col-span-2'} bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col shadow-xl">
                        <h4 class="font-bold text-white text-sm mb-4">Historial de Rondas</h4>
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold">
                                <tr><th class="p-3">Fecha/Hora</th><th class="p-3">Vigilador</th><th class="p-3">Punto QR</th><th class="p-3">Estado</th><th class="p-3">Novedad</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${rondas.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-500">Sin rondas registradas.</td></tr>` :
                                rondas.map(r => `<tr><td class="p-3">${r.fecha}</td><td class="p-3">${r.vigilador}</td><td class="p-3">${r.punto}</td><td class="p-3">${r.estado}</td><td class="p-3">${r.novedad || '-'}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    function registrarEscaneoQR() {
        const punto = document.getElementById('qr_punto').value;
        const checklist = document.getElementById('qr_chk').value;
        const estado = document.getElementById('qr_estado_chk').value;
        const novedad = document.getElementById('qr_novedad').value;

        const rondas = JSON.parse(localStorage.getItem('sp_rondas')) || [];
        rondas.unshift({ id: Date.now(), fecha: new Date().toLocaleString(), vigilador: currentUser.name, punto, checklist, estado, novedad, plant: selectedPlant });
        localStorage.setItem('sp_rondas', JSON.stringify(rondas));
        showModal('Guardado', 'Ronda registrada correctamente.', 'fa-solid fa-circle-check text-emerald-400', 'bg-emerald-500/10');
        render();
    }

    function renderNovedadesModule() {
        const novedades = (JSON.parse(localStorage.getItem('sp_novedades')) || []).filter(n => currentUser.globalAccess || n.plant === selectedPlant);
        return `
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                <h3 class="font-bold text-white text-base">Planilla General de Novedades</h3>
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400 uppercase"><tr><th class="p-3">Fecha</th><th class="p-3">Sector</th><th class="p-3">Descripción</th><th class="p-3">Estado</th></tr></thead>
                    <tbody class="divide-y divide-slate-800 text-slate-300">
                        ${novedades.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-500">Sin novedades.</td></tr>` :
                        novedades.map(n => `<tr><td class="p-3">${n.fecha}</td><td class="p-3">${n.sector}</td><td class="p-3">${n.descripcion}</td><td class="p-3">${n.estadoNovedad}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function renderVehiculosModule() { return renderSimplePlaceholder('Control de Acceso Vehicular'); }
    function renderTransportesModule() { return renderSimplePlaceholder('Novedades en Transportes'); }
    function renderCCTVModule() { return renderSimplePlaceholder('Control de Cámaras CCTV'); }
    function renderLlavesModule() { return renderSimplePlaceholder('Gestión y Entrega de Llaves'); }
    function renderCofresModule() { return renderSimplePlaceholder('Relevamiento de Cofres por Vestuario'); }

    function renderGestionModule() {
        const users = JSON.parse(localStorage.getItem('sp_users')) || [];
        return `
            <div class="space-y-6">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm">Crear Usuario Operativo</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" id="g_user" placeholder="Usuario" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                        <input type="password" id="g_pass" placeholder="Contraseña Temporal" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                        <input type="text" id="g_name" placeholder="Nombre y Apellido" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                        <select id="g_role" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                            <option value="vigilador">Vigilador</option>
                            <option value="encargado_turno">Encargado de Turno</option>
                            <option value="jefe_equipo">Jefe de Equipo (Admin)</option>
                        </select>
                    </div>
                    <button onclick="crearUsuarioAdmin()" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl text-xs transition">Crear Usuario</button>
                </div>
            </div>
        `;
    }

    function crearUsuarioAdmin() {
        const username = document.getElementById('g_user').value.trim();
        const pass = document.getElementById('g_pass').value;
        const name = document.getElementById('g_name').value.trim();
        const role = document.getElementById('g_role').value;
        if (!username || !pass || !name) return showModal('Atención', 'Complete todos los campos.', 'fa-solid fa-triangle-exclamation text-amber-400', 'bg-amber-500/10');

        let users = JSON.parse(localStorage.getItem('sp_users')) || [];
        users.push({ username, pass, name, role, plant: selectedPlant, mustChangePass: true });
        localStorage.setItem('sp_users', JSON.stringify(users));
        showModal('Éxito', 'Usuario creado correctamente.', 'fa-solid fa-circle-check text-emerald-400', 'bg-emerald-500/10');
        render();
    }

    function renderSimplePlaceholder(title) {
        return `
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-4">
                <h3 class="font-bold text-white text-base">${title}</h3>
                <p class="text-xs text-slate-400">Módulo operativo disponible en la plataforma multi-planta.</p>
            </div>
        `;
    }

    function exportPDFWithDates(mod) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(`Reporte Oficial - Seguridad Patrimonial (${mod.toUpperCase()})`, 14, 20);
        doc.save(`Reporte_${mod}.pdf`);
    }

    render();
</script>
