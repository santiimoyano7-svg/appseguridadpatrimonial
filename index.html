<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad Patrimonial - Operativa Multi-Planta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS para importar/exportar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF y AutoTable para exportar reportes en PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- MODAL GENERAL -->
    <div id="global_modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 max-w-md w-full rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <div id="modal_icon" class="w-10 h-10 rounded-xl flex items-center justify-center text-xl"></div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <h3 id="modal_title" class="text-lg font-bold text-white"></h3>
                <p id="modal_subtitle" class="text-xs text-slate-400 mt-1"></p>
            </div>
            <div id="modal_body" class="text-sm text-slate-300"></div>
            <div id="modal_footer" class="flex justify-end gap-3 pt-2"></div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS Y CONFIGURACIÓN ---
        const PLANTS = [
            { id: 'bagley_totoral', name: 'Bagley Totoral', admin: 'Moyano Santiago Iván' },
            { id: 'cartocor_totoral', name: 'Cartocor Totoral', admin: 'Moyano Santiago Iván' },
            { id: 'arcor_caroya', name: 'Arcor Caroya', admin: 'Yamila Soledad Jaime' },
            { id: 'bagley_cordoba', name: 'Bagley Córdoba', admin: 'Sabrina Emilce Santillan' },
            { id: 'edificio_chacabuco', name: 'Edificio Chacabuco', admin: 'Héctor Fabián Maldonado' }
        ];

        const INITIAL_USERS = [
            { username: 'moyano', pass: 'Admin123*', name: 'Moyano Santiago Iván', role: 'jefe_equipo', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
            { username: 'cartocor_admin', pass: 'Admin123*', name: 'Moyano Santiago Iván', role: 'administrador_planta', plant: 'cartocor_totoral', mustChangePass: true },
            { username: 'yamila', pass: 'Admin123*', name: 'Yamila Soledad Jaime', role: 'administrador_planta', plant: 'arcor_caroya', mustChangePass: true },
            { username: 'sabrina', pass: 'Admin123*', name: 'Sabrina Emilce Santillan', role: 'administrador_planta', plant: 'bagley_cordoba', mustChangePass: true },
            { username: 'hector', pass: 'Admin123*', name: 'Héctor Fabián Maldonado', role: 'administrador_planta', plant: 'edificio_chacabuco', mustChangePass: true },
            { username: 'ontiveros', pass: 'Seguridad123*', name: 'Ontiveros Gustavo Ariel', role: 'jefe_seguridad', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
            { username: 'varela', pass: 'Seguridad123*', name: 'Varela Sebastián Alfredo', role: 'jefe_seguridad', plant: 'bagley_totoral', mustChangePass: true, globalAccess: true },
            { username: 'vigilador1', pass: '1234', name: 'Juan Pérez', role: 'vigilador', plant: 'bagley_totoral', mustChangePass: false },
            { username: 'encargado1', pass: '1234', name: 'Carlos Gómez', role: 'encargado_turno', plant: 'bagley_totoral', mustChangePass: false }
        ];

        function initAppStorage() {
            if (!localStorage.getItem('sp_plants')) localStorage.setItem('sp_plants', JSON.stringify(PLANTS));
            if (!localStorage.getItem('sp_users')) localStorage.setItem('sp_users', JSON.stringify(INITIAL_USERS));
            if (!localStorage.getItem('sp_current_user')) localStorage.setItem('sp_current_user', null);
            if (!localStorage.getItem('sp_selected_plant')) localStorage.setItem('sp_selected_plant', null);
            if (!localStorage.getItem('sp_dynamic_sheets')) localStorage.setItem('sp_dynamic_sheets', JSON.stringify([]));

            const tables = ['rondas', 'novedades', 'vehiculos', 'transportes', 'cctv', 'llaves', 'cofres', 'correspondencia', 'autos_planta', 'cortacandados', 'notebooks', 'precintos', 'horarios', 'procedimientos'];
            tables.forEach(t => {
                if (!localStorage.getItem('sp_' + t)) localStorage.setItem('sp_' + t, JSON.stringify([]));
            });
        }
        initAppStorage();

        let currentUser = JSON.parse(localStorage.getItem('sp_current_user'));
        let selectedPlant = localStorage.getItem('sp_selected_plant');
        let currentModule = 'rondas';

        function render() {
            const app = document.getElementById('app');
            currentUser = JSON.parse(localStorage.getItem('sp_current_user'));
            selectedPlant = localStorage.getItem('sp_selected_plant');

            if (!currentUser) {
                app.innerHTML = renderLogin();
            } else if (currentUser.mustChangePass) {
                app.innerHTML = renderChangePassword();
            } else if (!selectedPlant) {
                app.innerHTML = renderPlantSelector();
            } else {
                app.innerHTML = renderDashboard();
                initModuleLogic();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                        <div class="text-center mb-6">
                            <div class="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-xl text-3xl mb-3 shadow-lg">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-white">Seguridad Patrimonial</h1>
                            <p class="text-xs text-slate-400 mt-1">Sistema Operativo Multi-Planta Arcor & Bagley</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Usuario / Legajo</label>
                                <input type="text" id="login_user" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contraseña</label>
                                <input type="password" id="login_pass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-600/30 text-sm">
                                Iniciar Sesión
                            </button>
                        </form>
                        <div class="mt-6 pt-6 border-t border-slate-800 text-[11px] text-slate-400 space-y-1 text-center">
                            <p class="font-semibold text-slate-300">Accesos principales:</p>
                            <p>• Super Admin: <span class="text-indigo-400 font-mono">moyano</span> / <span class="text-indigo-400 font-mono">Admin123*</span></p>
                            <p>• Jefes de Seguridad (Observadores): <span class="text-indigo-400 font-mono">ontiveros</span> / <span class="text-indigo-400 font-mono">varela</span></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value;
            const users = JSON.parse(localStorage.getItem('sp_users')) || [];
            const found = users.find(x => x.username === u && x.pass === p);

            if (found) {
                localStorage.setItem('sp_current_user', JSON.stringify(found));
                render();
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }

        function renderChangePassword() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                        <div class="text-center mb-6">
                            <div class="inline-flex p-3 bg-amber-500/20 text-amber-400 rounded-xl text-3xl mb-3">
                                <i class="fa-solid fa-key"></i>
                            </div>
                            <h2 class="text-xl font-bold text-white">Cambio de Contraseña Requerido</h2>
                            <p class="text-xs text-slate-400 mt-1">Por seguridad, debe actualizar su contraseña temporal antes de continuar.</p>
                        </div>
                        <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nueva Contraseña</label>
                                <input type="password" id="new_pass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-lg transition shadow-lg text-sm">
                                Actualizar y Continuar
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const np = document.getElementById('new_pass').value;
            if (np.length < 4) {
                alert('La contraseña debe tener al menos 4 caracteres.');
                return;
            }
            currentUser.pass = np;
            currentUser.mustChangePass = false;

            let users = JSON.parse(localStorage.getItem('sp_users'));
            users = users.map(u => u.username === currentUser.username ? currentUser : u);
            localStorage.setItem('sp_users', JSON.stringify(users));
            localStorage.setItem('sp_current_user', JSON.stringify(currentUser));
            render();
        }

        function renderPlantSelector() {
            const plants = JSON.parse(localStorage.getItem('sp_plants'));
            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-slate-950">
                    <div class="max-w-2xl w-full">
                        <div class="text-center mb-8">
                            <h1 class="text-2xl font-bold text-white mb-2">Seleccione Planta de Operación</h1>
                            <p class="text-slate-400 text-sm">Elija la instalación en la cual realizará el turno activo.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${plants.map(p => `
                                <button onclick="selectPlant('${p.id}')" class="bg-slate-900 hover:bg-indigo-950/40 border border-slate-800 hover:border-indigo-500 p-5 rounded-xl text-left transition flex items-center justify-between group">
                                    <div>
                                        <h3 class="font-bold text-white group-hover:text-indigo-400 text-base">${p.name}</h3>
                                        <p class="text-xs text-slate-400 mt-1">Adm: ${p.admin}</p>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-indigo-400 transition"></i>
                                </button>
                            `).join('')}
                        </div>
                        <div class="mt-8 text-center">
                            <button onclick="logout()" class="text-xs text-rose-400 hover:underline"><i class="fa-solid fa-right-from-bracket mr-1"></i> Cerrar Sesión</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPlant(id) {
            localStorage.setItem('sp_selected_plant', id);
            render();
        }

        function logout() {
            localStorage.removeItem('sp_current_user');
            localStorage.removeItem('sp_selected_plant');
            render();
        }

        function renderDashboard() {
            const plants = JSON.parse(localStorage.getItem('sp_plants'));
            const plantObj = plants.find(p => p.id === selectedPlant);
            const isObserver = currentUser.role === 'jefe_seguridad';
            const isAdmin = ['jefe_equipo', 'administrador_planta'].includes(currentUser.role);
            const dynamicSheets = JSON.parse(localStorage.getItem('sp_dynamic_sheets')) || [];

            return `
                <div class="flex h-screen overflow-hidden">
                    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
                        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                            <div>
                                <h2 class="font-bold text-white text-sm truncate">${plantObj ? plantObj.name : 'Planta'}</h2>
                                <p class="text-xs text-indigo-400 mt-0.5 capitalize">${currentUser.role.replace('_', ' ')} ${isObserver ? '(Observador)' : ''}</p>
                            </div>
                            <button onclick="changePlant()" title="Cambiar Planta" class="text-slate-400 hover:text-white text-xs bg-slate-800 p-2 rounded-lg">
                                <i class="fa-solid fa-exchange"></i>
                            </button>
                        </div>
                        <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-xs">
                            <div class="text-slate-500 font-semibold px-3 py-1 uppercase tracking-wider text-[10px]">Operativa Principal</div>
                            <a onclick="setModule('rondas')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='rondas'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-route w-5 text-center"></i> Rondas & Checklist</a>
                            <a onclick="setModule('novedades')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='novedades'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-triangle-exclamation w-5 text-center"></i> Novedades</a>
                            <a onclick="setModule('vehiculos')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='vehiculos'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-truck-ramp-box w-5 text-center"></i> Acceso Vehicular</a>
                            <a onclick="setModule('transportes')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='transportes'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-truck-fast w-5 text-center"></i> Novedades Transportes</a>
                            
                            <div class="text-slate-500 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Controles y Registros</div>
                            <a onclick="setModule('cctv')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='cctv'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-video w-5 text-center"></i> Control CCTV</a>
                            <a onclick="setModule('llaves')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='llaves'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-key w-5 text-center"></i> Gestión de Llaves</a>
                            <a onclick="setModule('cofres')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='cofres'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-box-archive w-5 text-center"></i> Relevamiento Cofres</a>
                            <a onclick="setModule('correspondencia')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='correspondencia'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-envelope w-5 text-center"></i> Correspondencia</a>
                            <a onclick="setModule('autos_planta')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='autos_planta'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-car w-5 text-center"></i> Autos Corporativos</a>
                            <a onclick="setModule('cortacandados')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='cortacandados'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-scissors w-5 text-center"></i> Corta Candados</a>
                            <a onclick="setModule('notebooks')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='notebooks'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-laptop w-5 text-center"></i> Registro Notebooks</a>
                            <a onclick="setModule('precintos')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='precintos'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-lock w-5 text-center"></i> Control Precintos</a>

                            ${dynamicSheets.length > 0 ? `
                                <div class="text-slate-500 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Planillas Importadas (Excel)</div>
                                ${dynamicSheets.map(ds => `
                                    <a onclick="setModule('dynamic_${ds.id}')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='dynamic_'+ds.id?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-file-excel w-5 text-center text-emerald-400"></i> ${ds.title}</a>
                                `).join('')}
                            ` : ''}

                            <div class="text-slate-500 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Institucional</div>
                            <a onclick="setModule('horarios')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='horarios'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-calendar-days w-5 text-center"></i> Horarios Mensuales</a>
                            <a onclick="setModule('procedimientos')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/50 cursor-pointer ${currentModule==='procedimientos'?'bg-indigo-600 text-white font-semibold':''}"><i class="fa-solid fa-book w-5 text-center"></i> Procedimientos PDF</a>

                            ${isAdmin ? `
                                <div class="text-slate-500 font-semibold px-3 pt-3 pb-1 uppercase tracking-wider text-[10px]">Administración</div>
                                <a onclick="setModule('gestion')" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-amber-400 hover:bg-slate-800/50 cursor-pointer ${currentModule==='gestion'?'bg-amber-600 text-white font-semibold':''}"><i class="fa-solid fa-gears w-5 text-center"></i> Gestión, Roles y Excel</a>
                            ` : ''}
                        </nav>
                        <div class="p-4 border-t border-slate-800 flex items-center justify-between bg-slate-950/40">
                            <span class="text-xs text-slate-300 font-medium truncate">${currentUser.name}</span>
                            <button onclick="logout()" title="Cerrar Sesión" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-power-off"></i></button>
                        </div>
                    </aside>

                    <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
                        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                            <h1 id="module_title" class="text-lg font-bold text-white capitalize">Módulo Operativo</h1>
                            <div class="flex items-center gap-3">
                                ${isObserver ? `<span class="px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full text-xs font-semibold border border-amber-500/30">Modo Observador (Solo Lectura)</span>` : ''}
                                <span class="px-3 py-1 bg-slate-800 text-slate-300 rounded-full text-xs font-semibold border border-slate-700">${plantObj ? plantObj.name : ''}</span>
                            </div>
                        </header>
                        <div id="module_container" class="flex-1 overflow-y-auto p-6"></div>
                    </main>
                </div>
            `;
        }

        function changePlant() {
            localStorage.removeItem('sp_selected_plant');
            render();
        }

        function setModule(mod) {
            currentModule = mod;
            render();
        }

        function initModuleLogic() {
            const container = document.getElementById('module_container');
            const title = document.getElementById('module_title');

            if (currentModule.startsWith('dynamic_')) {
                const sheetId = currentModule.replace('dynamic_', '');
                const dynamicSheets = JSON.parse(localStorage.getItem('sp_dynamic_sheets')) || [];
                const sheet = dynamicSheets.find(s => s.id == sheetId);
                if (sheet) {
                    title.innerText = sheet.title;
                    container.innerHTML = renderDynamicSheetModule(sheet);
                    return;
                }
            }

            switch(currentModule) {
                case 'rondas': title.innerText = "Rondas de Vigilancia & Checklist Aleatorio"; container.innerHTML = renderRondasModule(); break;
                case 'novedades': title.innerText = "Planilla General de Novedades y Seguimiento"; container.innerHTML = renderNovedadesModule(); break;
                case 'vehiculos': title.innerText = "Control de Acceso Vehicular"; container.innerHTML = renderVehiculosModule(); break;
                case 'transportes': title.innerText = "Registro de Novedades en Transportes"; container.innerHTML = renderTransportesModule(); break;
                case 'cctv': title.innerText = "Control de CCTV y Grabación"; container.innerHTML = renderCCTVModule(); break;
                case 'llaves': title.innerText = "Administración y Entrega de Llaves"; container.innerHTML = renderLlavesModule(); break;
                case 'cofres': title.innerText = "Relevamiento de Cofres por Vestuario"; container.innerHTML = renderCofresModule(); break;
                case 'correspondencia': title.innerText = "Control de Correspondencia y Paquetería"; container.innerHTML = renderCorrespondenciaModule(); break;
                case 'autos_planta': title.innerText = "Movimiento de Vehículos Corporativos"; container.innerHTML = renderAutosPlantaModule(); break;
                case 'cortacandados': title.innerText = "Entrega y Control de Corta Candados"; container.innerHTML = renderCortaCandadosModule(); break;
                case 'notebooks': title.innerText = "Registro de Ingreso / Egreso de Notebooks"; container.innerHTML = renderNotebooksModule(); break;
                case 'precintos': title.innerText = "Control de Precintos en Puertas de Emergencia"; container.innerHTML = renderPrecintosModule(); break;
                case 'horarios': title.innerText = "Cronograma y Horarios Mensuales"; container.innerHTML = renderHorariosModule(); break;

        function renderRondasModule() {
            const rondas = (JSON.parse(localStorage.getItem('sp_rondas')) || []).filter(r => currentUser.globalAccess || r.plant === selectedPlant);
            const isObserver = currentUser.role === 'jefe_seguridad';
            return `
                <div class="space-y-6">

                                        <option value="P2_DEPOSITO">Punto 2 - Depósito de Materia Prima</option>

                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Checklist de Riesgo</label>
                                    <select id="qr_chk" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
                                        <option value="Control de Riesgo Crítico">Control de Riesgo Crítico</option>
                                        <option value="Control de Precintos">Control de Precintos</option>
                                        <option value="Control de Cofres Vacíos">Control de Cofres Vacíos</option>

                                    <label class="block text-xs text-slate-400 mb-1">Estado</label>
                                    <select id="qr_estado_chk" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white">

                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Novedad (Opcional)</label>

                        <div class="${isObserver ? 'md:col-span-3' : 'md:col-span-2'} bg-slate-900 border border-slate-800 p-5 rounded-xl flex flex-col">
                            <h4 class="font-bold text-white text-sm mb-4">Historial de Rondas Registradas</h4>
                            <div class="overflow-x-auto flex-1">
                                <table class="w-full text-left text-xs">

                                        rondas.map(r => `

        function registrarEscaneoQR() {
            const punto = document.getElementById('qr_punto').value;
            const checklist = document.getElementById('qr_chk').value;
            const estado = document.getElementById('qr_estado_chk').value;
            const novedad = document.getElementById('qr_novedad').value;

            const rondas = JSON.parse(localStorage.getItem('sp_rondas')) || [];
            rondas.unshift({
                id: Date.now(),
                fecha: new Date().toLocaleString(),
                vigilador: currentUser.name,
                punto,
                checklist,
                estado,
                novedad,
                plant: selectedPlant
            });
            localStorage.setItem('sp_rondas', JSON.stringify(rondas));
            
            if (estado === 'Anómalo' && novedad) {
                const novedades = JSON.parse(localStorage.getItem('sp_novedades')) || [];
                novedades.unshift({
                    id: Date.now(),
                    fecha: new Date().toLocaleString(),
                    autor: currentUser.name,
                    sector: punto,
                    criticidad: 'Alta',
                    descripcion: novedad,
                    estadoNovedad: 'Abierta',
                    plant: selectedPlant
                });
                localStorage.setItem('sp_novedades', JSON.stringify(novedades));
            }

            alert('¡Ronda registrada con éxito!');
            render();
        }

                                <select id="nov_crit" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">

                                    <option value="Alta">Alta</option>

                                    <button onclick="crearNovedad()" class="px-4 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Registrar</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold">
                                <tr>
                                    <th class="p-3">Fecha</th>
                                    <th class="p-3">Sector</th>
                                    <th class="p-3">Descripción</th>
                                    <th class="p-3">Criticidad</th>
                                    <th class="p-3">Estado</th>
                                    ${!isObserver ? '<th class="p-3">Acciones</th>' : ''}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${novedades.length === 0 ? `<tr><td colspan="6" class="p-4 text-center text-slate-500">No hay novedades registradas.</td></tr>` :
                                novedades.map(n => `
                                    <tr>
                                        <td class="p-3">${n.fecha}</td>
                                        <td class="p-3 font-semibold text-white">${n.sector}</td>
                                        <td class="p-3">${n.descripcion}</td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${n.criticidad==='Alta'?'bg-rose-950 text-rose-400':'bg-amber-950 text-amber-400'}">${n.criticidad}</span></td>
                                        <td class="p-3 font-medium ${n.estadoNovedad==='Abierta'?'text-rose-400':n.estadoNovedad==='En Curso'?'text-amber-400':'text-emerald-400'}">${n.estadoNovedad}</td>${!isObserver ? `
                                            <td class="p-3 space-x-1">
                                                <button onclick="cambiarEstadoNovedad(${n.id}, 'En Curso')" class="px-2 py-1 bg-amber-600/20 text-amber-400 rounded text-[10px]">En Curso</button>

        function crearNovedad() {
            const sector = document.getElementById('nov_sector').value;
            const criticidad = document.getElementById('nov_crit').value;
            const descripcion = document.getElementById('nov_desc').value;
            if (!sector || !descripcion) return alert('Complete los campos.');

            const novedades = JSON.parse(localStorage.getItem('sp_novedades')) || [];
            novedades.unshift({ id: Date.now(), fecha: new Date().toLocaleString(), autor: currentUser.name, sector, criticidad, descripcion, estadoNovedad: 'Abierta', plant: selectedPlant });
            localStorage.setItem('sp_novedades', JSON.stringify(novedades));
            render();
        }

        function cambiarEstadoNovedad(id, estado) {
            let novedades = JSON.parse(localStorage.getItem('sp_novedades')) || [];
            novedades = novedades.map(n => n.id === id ? {...n, estadoNovedad: estado} : n);
            localStorage.setItem('sp_novedades', JSON.stringify(novedades));
            render();
        }

        function renderGestionModule() {
            const users = JSON.parse(localStorage.getItem('sp_users')) || [];
            return `
                <div class="space-y-6">
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
                        <h3 class="font-bold text-white text-sm">Crear Usuario Operativo</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input type="text" id="g_user" placeholder="Usuario" class="bg-slate-950 border border-slate-800 rounded p-2 text-xs text-white">
                            <input type="password" id="g_pass" placeholder="Contraseña Temporal" class="bg-slate-950 border border-slate-800 rounded p-2 text-xs text-white">
                            <input type="text" id="g_name" placeholder="Apellido y Nombre" class="bg-slate-950 border border-slate-800 rounded p-2 text-xs text-white">
                            <select id="g_role" class="bg-slate-950 border border-slate-800 rounded p-2 text-xs text-white">
                                <option value="vigilador">Vigilador</option>
                                <option value="encargado_turno">Encargado de Turno</option>
                                <option value="jefe_equipo">Jefe de Equipo (Administrador)</option>
                                <option value="jefe_seguridad">Jefe de Seguridad (Observador)</option>
                            </select>
                        </div>

                    </div>

                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
                        <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-file-excel text-emerald-400 mr-2"></i> Importar Planilla desde Excel</h3>
                        <input type="file" id="excel_file_input" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                        <button onclick="importarExcelPlanilla()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold">Generar Planilla</button>
                    </div>

                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                        <h4 class="font-bold text-white text-sm mb-4">Usuarios Registrados</h4>
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400"><tr><th class="p-3">Usuario</th><th class="p-3">Nombre</th><th class="p-3">Rol</th><th class="p-3">Planta</th></tr></thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${users.map(u => `<tr><td class="p-3 font-mono text-indigo-400">${u.username}</td><td class="p-3">${u.name}</td><td class="p-3 capitalize">${u.role.replace('_', ' ')}</td><td class="p-3">${u.plant}</td></tr>`).join('')}

                    </div>
                </div>
            `;
        }

        function crearUsuarioAdmin() {
            const username = document.getElementById('g_user').value.trim();
            const pass = document.getElementById('g_pass').value;
            const name = document.getElementById('g_name').value.trim();
            const role = document.getElementById('g_role').value;
            if (!username || !pass || !name) return alert('Complete todos los campos.');

            const users = JSON.parse(localStorage.getItem('sp_users')) || [];
            users.push({ username, pass, name, role, plant: selectedPlant, mustChangePass: true });
            localStorage.setItem('sp_users', JSON.stringify(users));
            alert('Usuario creado con éxito.');
            render();
        }

        function importarExcelPlanilla() {
            const fileInput = document.getElementById('excel_file_input');
            if (!fileInput.files || fileInput.files.length === 0) return alert('Seleccione un archivo Excel.');

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (json.length === 0) return alert('El archivo está vacío.');

                    const headers = json[0];
                    const rows = json.slice(1).map(row => {
                        let obj = {};
                        headers.forEach((h, index) => {
                            obj[h || `Col_${index}`] = row[index] !== undefined ? row[index] : '';
                        });
                        return obj;
                    });

                    const sheetId = 'sheet_' + Date.now();
                    const newSheet = { id: sheetId, title: file.name.replace(/\.[^/.]+$/, ""), headers: headers.filter(h => h), data: rows, plant: selectedPlant };
                    const dynamicSheets = JSON.parse(localStorage.getItem('sp_dynamic_sheets')) || [];
                    dynamicSheets.push(newSheet);
                    localStorage.setItem('sp_dynamic_sheets', JSON.stringify(dynamicSheets));
                    alert('¡Planilla generada desde Excel con éxito!');
                    setModule('dynamic_' + sheetId);
                } catch (err) {
                    alert('Error al leer el archivo Excel.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderDynamicSheetModule(sheet) {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">

                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400">
                                <tr>
                                    ${sheet.headers.map(h => `<th class="p-3">${h}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${sheet.data.length === 0 ? `<tr><td colspan="${sheet.headers.length}" class="p-4 text-center text-slate-500">Sin datos.</td></tr>` :
                                sheet.data.map(row => `<tr>${sheet.headers.map(h => `<td class="p-3">${row[h] !== undefined ? row[h] : ''}</td>`).join('')}</tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function exportPDF(mod) {

        render();
    </script>
