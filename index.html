<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sistema Integral de Seguridad - Panel Operativo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{industrial:{50:'#f8fafc',100:'#f1f5f9',800:'#1e293b',900:'#0f172a',accent:'#2563eb'}}}}}</script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center items-center">

<div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-6 border border-slate-800">
<div class="text-center space-y-2">
<div class="bg-blue-600 text-white w-14 h-14 rounded-2xl mx-auto flex items-center justify-center shadow-lg"><i class="fa-solid fa-shield-halved text-2xl"></i></div>
<h2 class="text-2xl font-bold text-slate-900">Control de Seguridad</h2>
<p class="text-xs text-slate-500">Ingrese sus credenciales seguras</p>
</div>
<form onsubmit="handleLogin(event)" class="space-y-4">
<div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuario</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
<input type="text" id="login-user" required autocomplete="username" placeholder="Ej. santiago.moyano" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div></div>
<div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
<input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div></div>
<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center space-x-2"><span>Ingresar al Sistema</span><i class="fa-solid fa-arrow-right-to-bracket"></i></button>
</form></div></div>

<div id="change-password-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-5">
<div class="text-center space-y-1"><div class="bg-amber-500 text-white w-12 h-12 rounded-full mx-auto flex items-center justify-center"><i class="fa-solid fa-key text-xl"></i></div>
<h3 class="text-xl font-bold text-slate-900">Actualizar Contraseña</h3><p class="text-xs text-slate-500">Por seguridad, establezca una contraseña robusta.</p></div>
<form onsubmit="saveNewPassword(event)" class="space-y-4 text-sm">
<div><label class="block font-medium text-slate-700 mb-1">Nueva Contraseña</label><input type="password" id="new-pass-1" required minlength="8" class="w-full border rounded-xl px-3 py-2.5"></div>
<div><label class="block font-medium text-slate-700 mb-1">Confirmar Contraseña</label><input type="password" id="new-pass-2" required minlength="8" class="w-full border rounded-xl px-3 py-2.5"></div>
<button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition">Actualizar y Continuar</button>
</form></div></div>

<div id="selection-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 space-y-6">
<div class="text-center space-y-1"><h3 class="text-xl font-bold text-slate-900">Configuración de Sesión</h3><p id="welcome-user-txt" class="text-sm text-blue-600 font-semibold"></p></div>
<div class="space-y-4 text-sm">
<div><label class="block font-bold text-slate-700 mb-1"><i class="fa-solid fa-building text-blue-600 mr-1"></i> Base Autorizada</label><select id="modal-plant-choice" class="w-full border rounded-xl px-3 py-2.5 bg-slate-50 font-medium"></select></div>
<div><label class="block font-bold text-slate-700 mb-1"><i class="fa-solid fa-clock text-blue-600 mr-1"></i> Turno</label><select id="modal-turno-choice" class="w-full border rounded-xl px-3 py-2.5 bg-slate-50 font-medium"><option value="No aplica">No aplica</option><option value="Turno Mañana (06:00 - 14:00)">Turno Mañana (06:00 - 14:00)</option><option value="Turno Tarde (14:00 - 22:00)">Turno Tarde (14:00 - 22:00)</option><option value="Turno Noche (22:00 - 06:00)">Turno Noche (22:00 - 06:00)</option></select></div>
</div>
<button onclick="confirmSession()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition text-sm">Iniciar Operación</button>
</div></div>

<div id="main-app-container" class="w-full min-h-screen flex flex-col hidden bg-slate-100 text-slate-800">
<header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
<div class="px-4 py-3 flex flex-wrap justify-between items-center gap-3">
<div class="flex items-center space-x-3"><div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fa-solid fa-shield-halved text-xl"></i></div>
<div><h1 class="text-lg font-bold tracking-wide">SEGURIDAD INDUSTRIAL</h1><p id="current-plant-subtitle" class="text-xs text-blue-400 font-medium">Base</p></div></div>
<div class="flex items-center space-x-3 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700"><span class="text-xs text-slate-400">Objetivo:</span><select id="global-plant-select" onchange="changePlant(this.value)" class="bg-slate-900 text-white text-xs font-bold px-2 py-1 rounded border border-slate-600"></select></div>
<div class="flex items-center space-x-3"><div class="text-right hidden md:block"><p id="current-user-role" class="text-xs font-semibold bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded border border-blue-700 inline-block">Rol</p></div>
<button onclick="logout()" class="bg-rose-900/60 hover:bg-rose-800 text-xs px-3 py-2 rounded-lg border border-rose-700 transition text-rose-200"><i class="fa-solid fa-right-from-bracket"></i> Salir</button></div>
</div></header>

<div class="flex flex-grow w-full relative">
<aside id="sidebar" class="bg-slate-900 text-slate-300 w-64 transition-all duration-300 flex flex-col border-r border-slate-800 sticky top-[65px] h-[calc(100vh-65px)] z-30">
<div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
<span id="sidebar-title-label" class="text-xs font-bold uppercase tracking-wider text-slate-400">Menú</span>
<button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800"><i id="sidebar-toggle-icon" class="fa-solid fa-angles-left"></i></button></div>
<div class="flex-grow overflow-y-auto p-2 space-y-1 text-sm">
<button onclick="switchTab('acceso-vehicular')" id="btn-acceso-vehicular" class="sidebar-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition text-left bg-blue-600 text-white font-semibold shadow-md"><i class="fa-solid fa-car-side text-lg min-w-[24px] text-center"></i><span class="sidebar-text truncate">Acceso Vehicular</span></button>
<button onclick="switchTab('flota-propia')" id="btn-flota-propia" class="sidebar-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition text-left hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-car text-lg min-w-[24px] text-center"></i><span class="sidebar-text truncate">Flota Propia</span></button>
<button onclick="switchTab('transportes')" id="btn-transportes" class="sidebar-btn w-full flex items-center space-x-3 px-3
